<style>
/* Layout: one-screen bar table — header, a single tall card in the middle, big thumb buttons at the bottom */
:root{
  color-scheme:dark;
  --bg:#1a0d12;
  --bg2:#2a131c;
  --fg:#f6e9e4;
  --muted:#b79a9f;
  --amber:#f4a640;
  --line:#3f2230;
  --ben:#e9566f;
  --dogru:#5fb8d9;
  --cesaret:#b46cf0;
  --herkes:#7bd17f;
  --emsi:#f4c542;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%) fixed, var(--bg);
  color:var(--fg);font-family:var(--body);font-size:16px;
  -webkit-tap-highlight-color:transparent;
}
.app{
  height:100%;display:flex;flex-direction:column;gap:14px;
  max-width:480px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px;box-sizing:border-box;
}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1;letter-spacing:-.01em}
.logo span{color:var(--amber)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;font-weight:500}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .3s}

.stage{flex:1;min-height:0;display:flex;align-items:stretch;perspective:1200px}
.card{
  position:relative;flex:1;border-radius:22px;
  background:var(--bg2);border:1px solid var(--line);
  display:flex;flex-direction:column;padding:24px 22px;gap:18px;
  box-shadow:0 20px 50px -20px #000;
  --c:var(--amber);
  overflow:hidden;
}
.card::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--c)}
.card.emsi{background:linear-gradient(160deg, #3a2a0e, var(--bg2) 55%);border-color:#6b5114}
.card.flip{animation:flip .38s ease-out}
@keyframes flip{from{transform:rotateY(-80deg) scale(.96);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}.bar i{transition:none}}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c);
  border:1px solid var(--c);border-radius:99px;padding:5px 11px}
.no{font-family:var(--display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.q{flex:1;display:flex;align-items:center;min-height:0;overflow:auto}
.q p{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.6rem, 7.2vw, 2.25rem);
  line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.rule{font-size:.95rem;color:var(--fg);background:#0003;border-radius:12px;padding:12px 14px;
  display:flex;gap:10px;align-items:center}
.rule b{color:var(--c)}
.shot{font-size:1.4rem;line-height:1}

.controls{display:grid;grid-template-columns:1fr 2fr;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:17px 14px;cursor:pointer;
  color:var(--fg);background:var(--line);font-size:1rem}
button.go{background:var(--amber);color:#2a1305;font-size:1.1rem}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:.75rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--d);margin-right:6px}

.hright{display:flex;align-items:center;gap:10px}
button.fs{padding:8px 11px;border-radius:12px;font-size:1.05rem;line-height:1}
/* start screen */
.start{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}
.start h1{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem, 15vw, 4.2rem);line-height:.92;margin:0;letter-spacing:-.03em;text-wrap:balance}
.start h1 em{font-style:normal;color:var(--amber);display:block}
.start p{margin:0;color:var(--muted);line-height:1.5;max-width:34ch}
.how{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.how li{display:flex;gap:10px;align-items:baseline;font-size:.95rem}
.how li i{width:10px;height:10px;border-radius:50%;background:var(--d);flex:none;transform:translateY(1px)}
.how li b{min-width:7.5em}
</style>

</head>

    <div class="stage">

        <div class="q"><p id="text"></p></div>
        <div class="rule"><span class="shot">🥃</span><span id="rule"></span></div>
      </article>
    </div>
    <div class="controls">
      <button id="back">Geri</button>
      <button class="go" id="next">Sonraki Kart</button>
    </div>
    <div class="controls" style="grid-template-columns:1fr 1fr">
      <button id="restart">Yeniden Karıştır</button>
      <button id="home">Ana Ekran</button>
    </div>
  </template>
</div>

  herkes: {tag:"Herkes / Kural", c:"var(--herkes)",  rule:"<b>Karttaki kural</b> geçerli."},
  emsi:   {tag:"⭐ Emsi Özel",    c:"var(--emsi)",    rule:"<b>Yapan içer.</b> Emsi'den sevgilerle."},
  final:  {tag:"Final",          c:"var(--amber)",   rule:"<b>Oyun bitti.</b> Şerefe!"}
};

let n = 0;
const all = [];
const add = (arr, type) => arr.forEach(t => all.push({id: ++n, type, text: t}));
add(BEN,"ben"); add(DOGRU,"dogru"); add(CESARET,"cesaret"); add(HERKES,"herkes");
all.push({id: ++n, type:"final", text: FINAL});      // 100
add(OLD_BEN,"ben"); add(OLD_DOGRU,"dogru"); add(OLD_CESARET,"cesaret"); add(OLD_HERKES,"herkes"); // 101-200
add(EMSI,"emsi");                                    // 201+

let deck = [], pos = 0;
const $ = id => document.getElementById(id);

function shuffle(){
  const pool = all.filter(c => c.type !== "final");
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  deck = [...pool, all.find(c => c.type === "final")];
  pos = 0;
}

function render(){
  const c = deck[pos], t = TYPES[c.type], card = $("card");
  card.style.setProperty("--c", t.c);
  card.classList.toggle("emsi", c.type === "emsi");
  $("tag").textContent = t.tag;
  $("no").textContent = "#" + c.id;
  $("text").textContent = c.text;
  $("rule").innerHTML = t.rule;
  $("count").textContent = (pos + 1) + " / " + deck.length;
  $("prog").style.width = ((pos + 1) / deck.length * 100) + "%";
  $("back").disabled = pos === 0;
  $("next").textContent = pos === deck.length - 1 ? "Bitti 🎉" : "Sonraki Kart";
  $("next").disabled = pos === deck.length - 1;
  card.classList.remove("flip"); void card.offsetWidth; card.classList.add("flip");
}

function startGame(){
  const app = $("app");
  app.innerHTML = "";
  app.appendChild($("gameTplStore").content.cloneNode(true));
  shuffle(); render();
  $("next").onclick = () => { if (pos < deck.length - 1){ pos++; render(); } };
  $("back").onclick = () => { if (pos > 0){ pos--; render(); } };
  $("restart").onclick = () => { shuffle(); render(); };
  $("home").onclick = () => { app.innerHTML = ""; app.appendChild(startNode.cloneNode(true)); $("begin").onclick = startGame; syncFs(); };
  $("card").onclick = () => $("next").click();
}

const fsEl = document.documentElement;
const canFs = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function syncFs(){
  document.querySelectorAll("[data-fs]").forEach(b => {
    b.hidden = !canFs;
    const on = isFs();
    b.textContent = b.classList.contains("fswide") ? (on ? "Tam Ekrandan Çık" : "⛶ Tam Ekran") : (on ? "✕" : "⛶");
    b.setAttribute("aria-label", on ? "Tam ekrandan çık" : "Tam ekran");
  });
}
async function toggleFs(){
  try {
    if (isFs()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else await (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  } catch(e) {}
  syncFs();
}
document.addEventListener("click", e => { if (e.target.closest("[data-fs]")) toggleFs(); });
document.addEventListener("fullscreenchange", syncFs);
document.addEventListener("webkitfullscreenchange", syncFs);
const _render = render;
render = function(){ _render(); syncFs(); };

// keep templates outside #app so we can swap screens
const tpl = $("gameTpl"); tpl.id = "gameTplStore"; document.body.appendChild(tpl);
const startNode = $("start").cloneNode(true);
$("begin").onclick = startGame;
syncFs();
document.addEventListener("keydown", e => {
  if (!$("next")) return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); $("next").click(); }
  if (e.key === "ArrowLeft") $("back").click();
});
</script>
</body>
</html>
